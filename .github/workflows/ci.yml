name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn test

      - run: yarn build
        env:
          ISABELLE_BASE_URL: https://isabelle.hackclub.com
          NEXT_TELEMETRY_DISABLED: '1'
